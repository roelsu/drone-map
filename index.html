<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>드론 비행 지도</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* 🔥 화면 출렁임 완벽 차단 (100dvh와 touch-action 적용) */
        html, body { 
            position: fixed;
            top: 0; left: 0;
            width: 100%; 
            height: 100dvh; /* 사파리 주소창 높이 변화 무시 */
            overflow: hidden; /* 전체 스크롤 금지 */
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, sans-serif; 
            touch-action: none; /* 브라우저 기본 터치 액션(바운스) 완전 금지 */
            background-color: white;
        }
        
        /* 지도는 터치(드래그) 허용 */
        #map { 
            height: 48dvh; 
            width: 100%; 
            border-bottom: 1px solid #ccc; 
            touch-action: auto; 
        }
        
        /* 하단 입력창은 스크롤 완전 차단 */
        .container { 
            height: 52dvh; 
            background: white; 
            padding: 15px; 
            box-sizing: border-box; 
            overflow: hidden; /* 내부 스크롤도 금지 */
        }
        
        .form-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .form-row .form-group { margin-bottom: 0; flex: 1; }
        .form-group { margin-bottom: 12px; }

        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #666; }
        input { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        /* iOS에서 입력창 터치 시 화면 확대 방지를 위한 설정 */
        input[type="number"], input[type="date"] { font-size: 16px; } 

        button { width: 100%; padding: 14px; background-color: #007aff; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .status { margin-top: 12px; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; }
        .valid { background-color: #d4edda; color: #155724; }
        .expired { background-color: #f8d7da; color: #721c24; }
        .empty { background-color: #e9ecef; color: #495057; }
        
        .my-location-dot {
            width: 12px; height: 12px;
            background-color: #007aff;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div class="container">
        <div class="form-row">
            <div class="form-group">
                <label>위도 (Lat)</label>
                <input type="number" id="lat" value="37.5665" step="0.0001">
            </div>
            <div class="form-group">
                <label>경도 (Lng)</label>
                <input type="number" id="lng" value="126.9780" step="0.0001">
            </div>
        </div>
        
        <div class="form-group">
            <label>반경 (m)</label>
            <input type="number" id="radius" value="500">
        </div>
        <div class="form-group">
            <label>유효기간 종료일</label>
            <input type="date" id="expiry">
        </div>
        <button onclick="updateMap()">지도에 적용하기</button>
        <div id="statusBox" class="status empty">정보를 입력해주세요</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 빈 공간 터치 시 키보드 내리기 (입력창 고정 유지 보조)
        document.querySelector('.container').addEventListener('touchstart', function(e) {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
                document.activeElement.blur();
            }
        });

        var map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        var droneCircle;
        var myLocationMarker;

        map.locate({ setView: true, maxZoom: 15, watch: true });

        function onLocationFound(e) {
            if (myLocationMarker) map.removeLayer(myLocationMarker);
            var locationIcon = L.divIcon({ className: 'my-location-dot' });
            myLocationMarker = L.marker(e.latlng, { icon: locationIcon }).addTo(map);
        }
        map.on('locationfound', onLocationFound);

        function updateMap() {
            var lat = parseFloat(document.getElementById('lat').value);
            var lng = parseFloat(document.getElementById('lng').value);
            var radius = parseFloat(document.getElementById('radius').value);
            var expiryDate = document.getElementById('expiry').value;

            if (droneCircle) map.removeLayer(droneCircle);

            droneCircle = L.circle([lat, lng], {
                color: '#ff3b30',
                fillColor: '#ff3b30',
                fillOpacity: 0.2,
                radius: radius
            }).addTo(map);

            map.flyTo([lat, lng], 14);

            if(expiryDate) {
                var today = new Date();
                today.setHours(0,0,0,0);
                var selectedDate = new Date(expiryDate);
                var statusBox = document.getElementById('statusBox');
                
                if(selectedDate >= today) {
                    statusBox.className = "status valid";
                    statusBox.innerHTML = "✅ 비행 승인 기간 (사용 가능)";
                } else {
                    statusBox.className = "status expired";
                    statusBox.innerHTML = "❌ 기간 만료 (비행 불가)";
                }
            }
        }
    </script>
</body>
</html>
