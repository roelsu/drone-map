<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>드론 비행 지도</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background-color: #f2f2f7; }
        #map { height: 45vh; width: 100%; border-bottom: 1px solid #ccc; z-index: 1; }
        .container { padding: 20px; background: white; height: 55vh; overflow-y: auto; box-sizing: border-box; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #555; }
        input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #d1d1d6; border-radius: 8px; box-sizing: border-box; background-color: #fafafa; }
        button { width: 100%; padding: 15px; background-color: #007aff; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .status { margin-top: 15px; padding: 15px; border-radius: 10px; text-align: center; font-weight: bold; font-size: 17px; }
        .valid { background-color: #d4edda; color: #155724; }
        .expired { background-color: #f8d7da; color: #721c24; }
        .empty { background-color: #e9ecef; color: #495057; }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div class="container">
        <div class="form-group">
            <label>위도 (Latitude)</label>
            <input type="number" id="lat" value="37.5665" step="0.0001">
        </div>
        <div class="form-group">
            <label>경도 (Longitude)</label>
            <input type="number" id="lng" value="126.9780" step="0.0001">
        </div>
        <div class="form-group">
            <label>반경 (m)</label>
            <input type="number" id="radius" value="500">
        </div>
        <div class="form-group">
            <label>유효기간 종료일</label>
            <input type="date" id="expiry">
        </div>
        <button onclick="updateMap()">지도에 적용하기</button>
        
        <div id="statusBox" class="status empty">날짜를 입력해주세요</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([37.5665, 126.9780], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var circle;

        function updateMap() {
            var lat = parseFloat(document.getElementById('lat').value);
            var lng = parseFloat(document.getElementById('lng').value);
            var radius = parseFloat(document.getElementById('radius').value);
            var expiryDate = document.getElementById('expiry').value;

            if(isNaN(lat) || isNaN(lng) || isNaN(radius)) {
                return alert("좌표와 반경을 숫자로 입력해주세요.");
            }

            if (circle) map.removeLayer(circle);

            circle = L.circle([lat, lng], {
                color: '#007aff',
                fillColor: '#007aff',
                fillOpacity: 0.25,
                radius: radius
            }).addTo(map);

            map.flyTo([lat, lng], 15);

            if(expiryDate) {
                var today = new Date();
                today.setHours(0,0,0,0);
                var selectedDate = new Date(expiryDate);
                
                var statusBox = document.getElementById('statusBox');
                if(selectedDate >= today) {
                    statusBox.className = "status valid";
                    statusBox.innerHTML = "✅ 비행 가능 (승인 구역)";
                } else {
                    statusBox.className = "status expired";
                    statusBox.innerHTML = "❌ 기간 만료 (비행 불가)";
                }
            }
        }
    </script>
</body>
</html>
