<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>드론 비행 지도</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; 
            overflow: hidden; margin: 0; padding: 0; 
            font-family: -apple-system, sans-serif; 
            touch-action: none; background-color: white;
            display: flex; flex-direction: column; /* 🔥 전체를 세로로 정렬 */
        }
        
        /* 🔥 지도가 남는 공간을 100% 꽉 채우도록 설정 (flex: 1) */
        #map { flex: 1; width: 100%; border-bottom: 1px solid #ccc; touch-action: auto; }
        
        /* 🔥 하단 입력창은 딱 안의 내용물 크기만큼만 공간을 차지함 (flex: none) */
        .container { 
            flex: none; background: white; 
            padding: 15px 15px 25px 15px; /* 아이폰 하단 여백을 위해 아래쪽 패딩을 조금 더 줌 */
            box-sizing: border-box; overflow: hidden; 
        }
        
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .form-row .form-group { margin-bottom: 0; flex: 1; }
        .form-group { margin-bottom: 10px; }

        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #666; }
        
        /* 🔥 유효기간의 회색 배경을 없애고 모든 입력칸을 흰색으로 통일 */
        input { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; background-color: white; }
        input[type="number"], input[type="date"] { font-size: 16px; } 

        .button-group { display: flex; gap: 10px; margin-top: 5px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-apply { background-color: #007aff; color: white; }
        .btn-clear { background-color: #f2f2f7; color: #ff3b30; } 
        
        .my-location-dot {
            width: 12px; height: 12px; background-color: #007aff;
            border: 2px solid white; border-radius: 50%;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }

        /* 🔥 날짜 옆에 붙을 D-Day 텍스트 스타일 */
        .date-status { font-size: 13px; font-weight: bold; margin-left: 5px; }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div class="container">
        <div class="form-row">
            <div class="form-group">
                <label>위도 (Lat)</label>
                <input type="number" id="lat" value="37.5665" step="0.0001">
            </div>
            <div class="form-group">
                <label>경도 (Lng)</label>
                <input type="number" id="lng" value="126.9780" step="0.0001">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>반경 (m)</label>
                <input type="number" id="radius" value="500">
            </div>
            <div class="form-group">
                <label>유효기간 종료일 <span id="dateStatus" class="date-status"></span></label>
                <input type="date" id="expiry">
            </div>
        </div>
        
        <div class="button-group">
            <button class="btn-clear" onclick="clearMap()">지우기</button>
            <button class="btn-apply" onclick="updateMap()">지도에 적용</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        document.querySelector('.container').addEventListener('touchstart', function(e) {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
                document.activeElement.blur();
            }
        });

        var map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        var droneCircle;
        var myLocationMarker;

        map.locate({ setView: true, maxZoom: 15, watch: true });

        function onLocationFound(e) {
            if (myLocationMarker) map.removeLayer(myLocationMarker);
            var locationIcon = L.divIcon({ className: 'my-location-dot' });
            myLocationMarker = L.marker(e.latlng, { icon: locationIcon }).addTo(map);
        }
        map.on('locationfound', onLocationFound);

        function updateMap() {
            var lat = parseFloat(document.getElementById('lat').value);
            var lng = parseFloat(document.getElementById('lng').value);
            var radius = parseFloat(document.getElementById('radius').value);
            var expiryDate = document.getElementById('expiry').value;

            if (isNaN(lat) || isNaN(lng) || isNaN(radius)) return alert("좌표와 반경을 숫자로 입력해주세요.");

            if (droneCircle) map.removeLayer(droneCircle);

            droneCircle = L.circle([lat, lng], {
                color: '#ff3b30',
                fillColor: '#ff3b30',
                fillOpacity: 0.2,
                radius: radius
            }).addTo(map);

            map.flyTo([lat, lng], 14);

            // 🔥 날짜 색상 변경 로직
            if(expiryDate) {
                var today = new Date();
                today.setHours(0,0,0,0);
                var selectedDate = new Date(expiryDate);
                
                var diffTime = selectedDate - today;
                var diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                var dateStatus = document.getElementById('dateStatus');
                var expiryInput = document.getElementById('expiry');
                
                if (diffDays < 0) {
                    dateStatus.innerHTML = "(만료됨)";
                    dateStatus.style.color = "#ff3b30";
                    expiryInput.style.color = "#ff3b30";
                } else if (diffDays <= 3) {
                    dateStatus.innerHTML = "(D-" + diffDays + ")";
                    dateStatus.style.color = "#ff3b30"; // 3일 이하: 빨간색
                    expiryInput.style.color = "#ff3b30";
                } else if (diffDays <= 15) {
                    dateStatus.innerHTML = "(D-" + diffDays + ")";
                    dateStatus.style.color = "#007aff"; // 15일 이하: 파란색
                    expiryInput.style.color = "#007aff";
                } else {
                    dateStatus.innerHTML = "(D-" + diffDays + ")";
                    dateStatus.style.color = "#333"; // 넉넉할 때: 기본 검정색
                    expiryInput.style.color = "#333";
                }
            }
        }

        function clearMap() {
            if (droneCircle) {
                map.removeLayer(droneCircle);
                droneCircle = null;
            }
            
            document.getElementById('lat').value = '';
            document.getElementById('lng').value = '';
            document.getElementById('radius').value = '500'; 
            
            var expiryInput = document.getElementById('expiry');
            expiryInput.value = '';
            expiryInput.style.color = 'black'; // 색상 원래대로
            
            document.getElementById('dateStatus').innerHTML = ""; // 상태 글씨 지우기
        }
    </script>
</body>
</html>
