<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>드론 비행 지도</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; 
            overflow: hidden; margin: 0; padding: 0; 
            font-family: -apple-system, sans-serif; 
            touch-action: none; background-color: white;
            display: grid; 
            grid-template-rows: 1fr auto; 
        }
        
        #map { 
            width: 100%; height: 100%; border-bottom: 1px solid #ccc; 
            touch-action: auto; z-index: 1;
        }
        
        .container { 
            width: 100%; background: white; 
            padding: 15px 15px calc(15px + env(safe-area-inset-bottom)) 15px; 
            box-sizing: border-box; z-index: 2;
        }
        
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .form-row .form-group { margin-bottom: 0; flex: 1; }
        .form-group { margin-bottom: 10px; }

        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #666; }
        
        input { 
            width: 100%; height: 42px; line-height: 42px; 
            padding: 0 10px; margin: 0; font-size: 16px; 
            border: 1px solid #ddd; border-radius: 8px; 
            box-sizing: border-box; background-color: white; 
            -webkit-appearance: none; appearance: none;
        }

        input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0; }

        .button-group { display: flex; gap: 10px; margin-top: 5px; }
        button { flex: 1; height: 46px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-apply { background-color: #007aff; color: white; }
        .btn-clear { background-color: #f2f2f7; color: #ff3b30; } 
        
        .my-location-dot {
            width: 12px; height: 12px; background-color: #007aff;
            border: 2px solid white; border-radius: 50%;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }

        .date-dday { font-size: 13px; font-weight: bold; margin-left: 5px; }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div class="container">
        <div class="form-row">
            <div class="form-group">
                <label>위도 (Lat)</label>
                <input type="text" id="lat" value="37.5665" placeholder="예: 37° 24′ 40″ N">
            </div>
            <div class="form-group">
                <label>경도 (Lng)</label>
                <input type="text" id="lng" value="126.9780" placeholder="예: 126° 55′ 49″ E">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>반경 (m)</label>
                <input type="number" id="radius" value="500">
            </div>
            <div class="form-group">
                <label>유효기간 종료일 <span id="dateDDay" class="date-dday"></span></label>
                <input type="date" id="expiry">
            </div>
        </div>
        
        <div class="button-group">
            <button class="btn-clear" onclick="clearMap()">지우기</button>
            <button class="btn-apply" onclick="updateMap()">지도에 적용</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        document.querySelector('.container').addEventListener('touchstart', function(e) {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
                document.activeElement.blur();
            }
        });

        var map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        setTimeout(function() {
            map.invalidateSize();
        }, 100);

        var droneCircle;
        var myLocationMarker;

        map.locate({ setView: true, maxZoom: 15, watch: true });

        function onLocationFound(e) {
            if (myLocationMarker) map.removeLayer(myLocationMarker);
            var locationIcon = L.divIcon({ className: 'my-location-dot' });
            myLocationMarker = L.marker(e.latlng, { icon: locationIcon }).addTo(map);
        }
        map.on('locationfound', onLocationFound);

        // 🔥 스마트 좌표 변환기 (도/분/초 문자를 소수점 숫자로 자동 계산)
        function parseCoordinate(inputStr) {
            if (!inputStr) return NaN;
            
            // 입력된 문자열에서 기호 빼고 '숫자'만 순서대로 추출
            var matches = inputStr.match(/\d+(\.\d+)?/g);
            if (!matches) return NaN;

            var val = 0;
            if (matches.length >= 3) {
                // 도, 분, 초 3개가 다 들어있는 경우
                val = parseFloat(matches[0]) + (parseFloat(matches[1]) / 60) + (parseFloat(matches[2]) / 3600);
            } else if (matches.length === 2) {
                // 도, 분 2개만 있는 경우
