<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>드론 비행 통합 관리 대시보드</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/ko.js"></script> <style>
        /* 기존 CSS 생략 (레이아웃 유지) */
        html, body { margin: 0; padding: 0; width: 100%; height: 100dvh; font-family: -apple-system, sans-serif; background-color: #f5f7fa; overflow: hidden; position: relative; }
        #map { width: 100%; height: 100dvh; z-index: 1; position: absolute; }
        .sidebar-wrapper { position: absolute; top: 0; right: 0; width: 360px; height: 100dvh; z-index: 1001; transition: transform 0.35s; }
        .sidebar-wrapper.hidden { transform: translateX(100%); }
        .toggle-btn { position: absolute; top: 40px; left: -44px; z-index: 1002; width: 44px; height: 48px; background: #3182ce; color: white; border-radius: 12px 0 0 12px; border: none; cursor: pointer; }
        .dashboard-panel { width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); padding: 20px; box-sizing: border-box; overflow-y: auto; }
        input[type="text"], input[type="number"], .flatpickr-input { width: 100%; height: 34px; padding: 0 8px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; background: white; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 10px; }
        .btn-add { background-color: #3182ce; color: white; width: 100%; height: 45px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="sidebar-wrapper" id="sidebar-wrapper">
        <button class="toggle-btn" id="toggle-btn" onclick="togglePanel()">▶️</button>
        <div class="dashboard-panel">
            <div class="form-group">
                <label>신청 날짜</label>
                <input type="text" id="app-date" placeholder="클릭해서 날짜 선택">
            </div>
            <div class="form-group">
                <label>만료 날짜</label>
                <input type="text" id="expiry-date" placeholder="클릭해서 날짜 선택">
            </div>
            <button class="btn-add" onclick="addNewLocation()">✅ 등록 및 클라우드 저장</button>
            <div id="location-list"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 파이어베이스 설정 (아까 수정한 싱가포르 주소 그대로 사용!)
        var firebaseConfig = {
            apiKey: "AIzaSyCQlcMwNfPicDN5AYLKZ9G0a7sc7Oc2d4E",
            authDomain: "drone-map-3aae0.firebaseapp.com",
            databaseURL: "https://drone-map-3aae0-default-rtdb.asia-southeast1.firebasedatabase.app", 
            projectId: "drone-map-3aae0"
        };
        firebase.initializeApp(firebaseConfig);
        var locationsRef = firebase.database().ref('drone_locations');

        // 휠 달력 초기화
        flatpickr("#app-date", { locale: "ko", dateFormat: "Y-m-d" });
        flatpickr("#expiry-date", { locale: "ko", dateFormat: "Y-m-d" });

        // (이하 기존 지도 로직 및 나머지 함수들 동일)
        var map = L.map('map', { zoomControl: false }).setView([37.5500, 126.9000], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        function togglePanel() { /* 생략 */ }
        function addNewLocation() { /* 기존 로직 동일 */ }
    </script>
</body>
</html>
