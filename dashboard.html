<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>드론 비행 통합 관리 대시보드</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/ko.js"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100dvh; font-family: -apple-system, sans-serif; background-color: #f5f7fa; overflow: hidden; }
        #map { width: 100%; height: 100dvh; z-index: 1; position: absolute; }
        .sidebar-wrapper { position: absolute; top: 0; right: 0; width: 360px; max-width: 90vw; height: 100dvh; z-index: 1001; transition: transform 0.35s; background: white; box-shadow: -4px 0 24px rgba(0,0,0,0.15); }
        .sidebar-wrapper.hidden { transform: translateX(100%); }
        .toggle-btn { position: absolute; top: 40px; left: -44px; z-index: 1002; width: 44px; height: 48px; background: #3182ce; color: white; border-radius: 12px 0 0 12px; border: none; cursor: pointer; }
        .dashboard-panel { width: 100%; height: 100%; padding: 20px; overflow-y: auto; }
        .btn-add { background-color: #3182ce; color: white; width: 100%; height: 45px; border-radius: 8px; border: none; font-weight: bold; }
        .location-card { border: 1px solid #e2e8f0; padding: 10px; margin-top: 10px; border-radius: 6px; }
        .btn-delete { background: #fed7d7; color: #e53e3e; border: none; padding: 4px; float: right; cursor: pointer; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="sidebar-wrapper" id="sidebar-wrapper">
        <button class="toggle-btn" onclick="togglePanel()">▶️</button>
        <div class="dashboard-panel">
            <textarea id="bulk-coords" placeholder="좌표 입력 (위도, 경도)"></textarea>
            <input type="text" id="app-date" placeholder="신청 날짜">
            <input type="text" id="expiry-date" placeholder="만료 날짜">
            <button class="btn-add" onclick="addNewLocation()">✅ 등록</button>
            <div id="location-list"></div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyCQlcMwNfPicDN5AYLKZ9G0a7sc7Oc2d4E",
            authDomain: "drone-map-3aae0.firebaseapp.com",
            databaseURL: "https://drone-map-3aae0-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "drone-map-3aae0"
        };
        firebase.initializeApp(firebaseConfig);
        var locationsRef = firebase.database().ref('drone_locations');
        var map = L.map('map').setView([37.5500, 126.9000], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        flatpickr("#app-date", { locale: "ko", dateFormat: "Y-m-d" });
        flatpickr("#expiry-date", { locale: "ko", dateFormat: "Y-m-d" });

        function addNewLocation() {
            var coords = document.getElementById('bulk-coords').value.split(',');
            if(coords.length < 2) return alert("좌표 형식을 확인하세요!");
            locationsRef.push({ lat: coords[0].trim(), lng: coords[1].trim(), expiry: document.getElementById('expiry-date').value });
            alert("저장 완료!");
        }

        // 데이터가 들어오면 즉시 지도에 마커 찍기!
        locationsRef.on('value', function(snapshot) {
            map.eachLayer((layer) => { if (layer instanceof L.Marker) map.removeLayer(layer); });
            snapshot.forEach(child => {
                var d = child.val();
                L.marker([d.lat, d.lng]).addTo(map).bindPopup("만료: " + d.expiry);
            });
        });

        function togglePanel() { document.getElementById('sidebar-wrapper').classList.toggle('hidden'); }
    </script>
</body>
</html>
