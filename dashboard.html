<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>드론 비행 통합 관리 대시보드</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden; font-family: -apple-system, sans-serif; }
        #map { width: 100%; height: 100dvh; z-index: 1; }
        
        /* 사이드바 스타일 */
        .sidebar { 
            position: absolute; top: 0; right: 0; width: 340px; height: 100dvh; 
            background: white; z-index: 1001; transition: transform 0.3s ease;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1); padding: 20px; box-sizing: border-box;
            overflow-y: auto;
        }
        .sidebar.hidden { transform: translateX(100%); }
        .toggle-btn { 
            position: absolute; left: -40px; top: 20px; width: 40px; height: 40px; 
            background: #3182ce; color: white; border: none; border-radius: 6px 0 0 6px; 
            cursor: pointer; font-size: 20px; z-index: 1002;
        }
        
        /* 폼 스타일 */
        .form-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .form-row { display: flex; gap: 8px; }
        .form-group { flex: 1; display: flex; flex-direction: column; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; }
        button { padding: 10px; border: none; border-radius: 4px; cursor: pointer; background: #3182ce; color: white; font-weight: bold; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div class="sidebar" id="sidebar">
        <button class="toggle-btn" onclick="toggleSidebar()">◀️</button>
        <div class="form-container">
            <h3>드론 비행 관리</h3>
            <textarea id="bulk-coords" placeholder="좌표 붙여넣기"></textarea>
            <div class="form-row">
                <input type="date" id="app-date">
                <input type="date" id="expiry-date">
            </div>
            <input type="text" id="memo" placeholder="특이사항(메모)">
            <button onclick="addNewLocation()">✅ 등록하기</button>
        </div>
        <div id="location-list"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([37.5500, 126.9000], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('hidden');
        }

        var locations = JSON.parse(localStorage.getItem('drone_dashboard_locs')) || [];
        var circleLayers = [];

        function renderAll() {
            circleLayers.forEach(l => map.removeLayer(l));
            circleLayers = [];
            locations.forEach(loc => {
                var circle = L.circle([loc.lat, loc.lng], {radius: loc.radius}).addTo(map);
                // 🔥 팝업 기능 추가
                circle.bindPopup(`<b>📅 만료: ${loc.expiry}</b><br>📝 ${loc.memo}`);
                circleLayers.push(circle);
            });
        }

        function addNewLocation() {
            // ... (기존 좌표 추출 로직) ...
            locations.push({lat: 37.55, lng: 126.90, expiry: '2026-12-31', memo: '예시 메모', radius: 500});
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('drone_dashboard_locs', JSON.stringify(locations));
            renderAll();
        }
        renderAll();
    </script>
</body>
</html>
